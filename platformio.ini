[platformio]
default_envs = esp32-c6-devkitc-1

[env]
platform = espressif32@^6.9.0
framework = arduino
build_flags = -Isrc -Iinclude
monitor_speed = 115200
test_framework = unity
test_build_src = no

[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=0 -O2

; Host-runnable tests are limited to pure C++ modules until hardware dependencies are mocked.
[env:native]
platform = native
test_framework = unity
test_ignore =
    test_qtr8rc
    test_encoders
    test_bno055
    test_motor_driver
build_flags = ${env.build_flags} -std=gnu++11
